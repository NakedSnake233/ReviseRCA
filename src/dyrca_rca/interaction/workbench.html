<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拓扑 RCA 交互工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#1b3040;font:15px system-ui,sans-serif}header{background:#123a4b;color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}main{padding:20px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.panel{background:white;border:1px solid #d7e0e5;border-radius:10px;padding:18px;margin-bottom:16px}h2{font-size:17px;margin:0 0 14px}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #acbbc5;border-radius:5px;max-width:100%}input,select,textarea{width:100%}button{background:#126c73;color:white;cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.45;cursor:default}.graphs{display:grid;grid-template-columns:1fr 1fr;gap:10px}svg{width:100%;height:330px;background:#f8fafb;border:1px solid #e2e8ed}svg text{font:10px system-ui;fill:#183747}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #e1e7eb;word-break:break-word}.muted{color:#627784;font-size:13px}.status{padding:12px;background:#edf7f6;margin-bottom:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#message{color:#9a372a;min-height:24px}.scroll{max-height:250px;overflow:auto}@media(max-width:900px){.grid,.graphs{grid-template-columns:1fr}}
</style><header><h1>拓扑 RCA · 交互工作台</h1><span>观察 → 提议 → 预览 → 接受</span></header><main>
<div class="status" id="status">正在加载案例…</div><div id="message" role="alert"></div><div class="grid"><aside>
<section class="panel"><h2>任务与反馈</h2><label for="case">案例</label><select id="case"></select><label for="task">拓扑任务</label><select id="task"><option value="T2">T2 · Pod／端点迁移</option><option value="T3">T3 · 重定向／空端点</option><option value="T4">T4 · 版本拆分</option></select><label for="service">服务</label><select id="service"></select>
<div id="endpointFields"><label for="ips">正确的端点 IP（逗号分隔）</label><input id="ips"><p class="muted">清空表示确认空端点。请根据证据填写。</p></div>
<div id="versionFields" hidden><label for="versions">版本（逗号分隔）</label><input id="versions" placeholder="v1,v2"><label for="weights">路由比例（总和为 1）</label><input id="weights" placeholder="0.9,0.1"><p class="muted">比例由操作者提供；Pod 数量不等于流量比例。</p></div>
<label for="actor">操作者</label><input id="actor" value="local-operator"><label for="reason">判断依据</label><textarea id="reason" rows="3" placeholder="说明观察来源与修正原因"></textarea><button id="propose">保存提议</button></section>
<section class="panel"><h2>反馈记录</h2><label for="feedback">选择反馈</label><select id="feedback"></select><button id="preview">预览</button><button id="accept">接受</button><button id="reject">拒绝</button><button id="retract">撤回</button><button id="export">导出事件</button><p class="muted">失败的决策留在审计记录中，正式结果保持原样。</p></section></aside>
<div><section class="panel"><h2 id="compareTitle">初始结果与当前结果</h2><label><input id="focus" type="checkbox" checked style="width:auto"> 只看所选服务及相邻节点</label><div class="graphs"><div><p>修改前</p><svg id="before" viewBox="0 0 520 330" aria-label="修改前拓扑"></svg></div><div><p id="afterLabel">当前正式状态</p><svg id="after" viewBox="0 0 520 330" aria-label="修改后拓扑"></svg></div></div><p class="muted">绿色：新增　红色：移除　橙色：属性变化。点击节点或边查看详情。</p><pre id="detail">选择图元素查看证据与属性。</pre></section>
<section class="panel"><h2>前后解释</h2><div id="summary"></div><div class="scroll"><table id="ranking"></table></div><details><summary>结构与证据变化明细</summary><pre id="diff"></pre></details></section>
<section class="panel"><h2>诊断证据与下一步</h2><p id="harnessStatus"></p><ul id="needsEvidence"></ul><details><summary>候选依据与模型分差</summary><pre id="harnessDetails"></pre></details></section><section class="panel"><h2>当前观察证据</h2><p class="muted">以下为可用快照与汇总证据；缺失不是正常，排名变化不证明故障因果。</p><div class="scroll"><pre id="evidence"></pre></div></section></div></div></main>
<script>
const $=id=>document.getElementById(id), token='__TOKEN__';let cases=[],current,lastComparison,positions={};
const csv=id=>$(id).value.split(',').map(s=>s.trim()).filter(Boolean);
function option(select,text,value){const o=document.createElement('option');o.textContent=text;o.value=value;select.append(o)}
function fillService(){const s=current.options.services.find(x=>x.name===$('service').value);$('ips').value=(s.endpoint_ips||[]).join(',');const vs=[...new Set(current.options.pods.filter(p=>p.service===s.name).map(p=>p.version).filter(Boolean))].sort();$('versions').value=vs.join(',');$('weights').value='';}
function feedbackButtons(){const s=current.statuses[$('feedback').value];$('preview').disabled=$('accept').disabled=$('reject').disabled=s!=='proposed';$('retract').disabled=s!=='accepted';}
function graph(id,data,delta,side){const svg=$(id);svg.replaceChildren();const ns='http://www.w3.org/2000/svg';const defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker'),arrow=document.createElementNS(ns,'path');marker.id=id+'-arrow';for(const [k,v] of Object.entries({viewBox:'0 0 10 10',refX:16,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'}))marker.setAttribute(k,v);arrow.setAttribute('d','M 0 0 L 10 5 L 0 10 z');arrow.setAttribute('fill','#7e99a6');marker.append(arrow);defs.append(marker);svg.append(defs);const nodes=data.nodes.filter(n=>positions[n.id]);
function el(tag,attrs){const x=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);svg.append(x);return x}
const changed=new Set(delta.nodes.changed.map(n=>n.id)),special=new Set(delta.nodes[side==='before'?'removed':'added'].map(n=>n.id));
for(const e of data.edges){if(!positions[e.source]||!positions[e.target])continue;const [x1,y1]=positions[e.source],[x2,y2]=positions[e.target];const key=JSON.stringify([e.source,e.target,e.edge_type]);const match=a=>a.some(q=>q.source===e.source&&q.target===e.target&&q.edge_type===e.edge_type);let color=match(delta.edges[side==='before'?'removed':'added'])?(side==='before'?'#bf5049':'#21836b'):delta.edges.changed.some(q=>q.id===key)?'#c48823':'#bbcad1';const line=el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':2,'marker-end':`url(#${id}-arrow)`});line.onclick=()=>{$('detail').textContent=JSON.stringify(e,null,2)};}
for(const n of nodes){const [cx,cy]=positions[n.id];const color=special.has(n.id)?(side==='before'?'#bf5049':'#21836b'):changed.has(n.id)?'#c48823':'#30677d';const circle=el('circle',{cx,cy,r:7,fill:color});circle.onclick=()=>{$('detail').textContent=JSON.stringify(n,null,2)};const t=el('text',{x:cx,y:cy-11,'text-anchor':'middle'});t.textContent=n.id.length>27?n.id.slice(0,25)+'…':n.id;}}
function comparison(a,b,d,preview=false){const harness=b.harness;$('harnessStatus').textContent=harness?harness.statement:'当前结果未提供时序证据解释。';$('needsEvidence').replaceChildren();for(const request of (harness?harness.needs_evidence:[])){const li=document.createElement('li');li.textContent=request;$('needsEvidence').append(li)}$('harnessDetails').textContent=harness?JSON.stringify(harness,null,2):'';lastComparison=[a,b,d,preview];const all=[...a.graph.nodes,...b.graph.nodes],selected=$('service').value;let ids=new Set(all.map(n=>n.id));if($('focus').checked){ids=new Set(all.filter(n=>n.id===selected||n.attrs.service===selected||n.attrs.parent===selected).map(n=>n.id));for(const e of [...a.graph.edges,...b.graph.edges])if(e.source===selected||e.target===selected){ids.add(e.source);ids.add(e.target)}}positions={};const ordered=[...ids].sort();ordered.forEach((n,i)=>{const angle=2*Math.PI*i/Math.max(ordered.length,1);positions[n]=[260+165*Math.cos(angle),165+115*Math.sin(angle)]});$('compareTitle').textContent=preview?'当前正式结果与提议预览':'初始结果与当前结果';$('afterLabel').textContent=preview?'预览 · 尚未生效':'当前正式状态';graph('before',a.graph,d,'before');graph('after',b.graph,d,'after');$('summary').textContent=`节点 +${d.nodes.added.length} / −${d.nodes.removed.length}，边 +${d.edges.added.length} / −${d.edges.removed.length}，证据修改 ${d.evidence.changed.length}。${d.interpretation}`;$('diff').textContent=JSON.stringify(d,null,2);$('ranking').replaceChildren();if(!d.prediction_available){$('ranking').textContent='未加载兼容检查点：仅显示图结构，不生成排名。';return}for(const row of [['候选','原排名','新排名','原分数','新分数'],...d.ranking.map(r=>[r.candidate,r.before_rank,r.after_rank,r.before_score,r.after_score])]){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=v==null?'—':typeof v==='number'&&!Number.isInteger(v)?v.toFixed(5):v;tr.append(td)}$('ranking').append(tr)}}
function render(){const s=current.session;$('status').textContent=`正式版本 ${s.state_revision} · 审计事件 ${s.audit_seq} · ${current.current.prediction?'固定模型已加载':'仅图结构 · 未加载模型'}`;const selectedService=$('service').value;$('service').replaceChildren();for(const x of current.options.services)option($('service'),x.name,x.name);if([...$('service').options].some(o=>o.value===selectedService))$('service').value=selectedService;else fillService();const selectedFeedback=$('feedback').value;$('feedback').replaceChildren();for(const e of s.events)if(current.statuses[e.event_id])option($('feedback'),`${({proposed:'待处理',accepted:'已接受',rejected:'已拒绝',retracted:'已撤回',superseded:'已替代'})[current.statuses[e.event_id]]} · ${e.reason}`,e.event_id);if([...$('feedback').options].some(o=>o.value===selectedFeedback))$('feedback').value=selectedFeedback;feedbackButtons();comparison(current.baseline,current.current,current.comparison);$('evidence').textContent=JSON.stringify({modalities:s.observation.modalities,evidence:current.current.evidence_pack.evidence},null,2);}
async function command(action){$('message').textContent='';try{const d={action,incident_id:current.session.incident_id,base_revision:current.session.state_revision,event_id:crypto.randomUUID(),target_id:$('feedback').value,actor:$('actor').value,reason:$('reason').value};if(action==='propose'){if(!d.reason.trim())throw Error('请填写判断依据');d.task=$('task').value;d.service=$('service').value;d.values=d.task==='T4'?{versions:csv('versions'),weights:csv('weights').map(Number)}:{endpoint_ips:csv('ips')};}else if(!d.reason.trim())d.reason='操作者审阅反馈';const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench-Token':token},body:JSON.stringify(d)}),v=await r.json();if(!r.ok)throw Error(v.error);if(action==='preview'){comparison(current.current,v.preview,v.comparison,true);return}current=v;cases=cases.map(c=>c.session.incident_id===v.session.incident_id?v:c);render();if(action==='propose'){$('feedback').value=d.event_id;feedbackButtons()}const outcome=v.session.outcomes[d.event_id];if(outcome&&outcome.execution_status==='failed')$('message').textContent='执行失败：'+outcome.error_type+'；正式状态保持原样。';}catch(e){$('message').textContent=e.message;}}
$('case').onchange=()=>{current=cases.find(c=>c.session.incident_id===$('case').value);$('task').value=current.task_hint||'T2';$('task').onchange();$('service').replaceChildren();render()};$('service').onchange=()=>{fillService();if(lastComparison)comparison(...lastComparison)};$('focus').onchange=()=>comparison(...lastComparison);$('feedback').onchange=feedbackButtons;$('task').onchange=()=>{$('versionFields').hidden=$('task').value!=='T4';$('endpointFields').hidden=$('task').value==='T4'};for(const [id,action]of Object.entries({propose:'propose',preview:'preview',accept:'accept_feedback',reject:'reject_feedback',retract:'retract_feedback'}))$(id).onclick=()=>command(action);
$('export').onclick=()=>{const blob=new Blob([current.session.events.map(JSON.stringify).join('\n')+'\n'],{type:'application/x-ndjson'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='feedback.jsonl';a.click();URL.revokeObjectURL(url)};
fetch('/api/cases').then(r=>r.json()).then(v=>{cases=v;for(const c of cases)option($('case'),`${c.task_hint} · ${c.session.incident_id}`,c.session.incident_id);current=cases[0];render()}).catch(e=>$('message').textContent=e.message);
</script></html>
