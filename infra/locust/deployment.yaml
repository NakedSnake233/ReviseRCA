# ============================================================
# Locust load generator deployment
# Namespace: boutique (same as target, for direct service access)
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts
  namespace: boutique
data:
  locustfile.py: |
    """
    Locust load generator for Online Boutique.
    Simulates realistic user behavior: browse, view product, add to cart, checkout.
    """

    import random
    from locust import HttpUser, task, between

    PRODUCT_IDS = [
        "OLJCESPC7Z", "66VCHSJNUP", "1YMWWN1N4O", "L9ECAV7KIM",
        "2ZYFJ3GM2N", "0PUK6V6EV0", "LS4PSXUNUM", "HQTGWGPNH4",
        "9SIQT8TO72", "6E92ZM6F9J",
    ]
    CURRENCIES = ["USD", "EUR", "JPY", "GBP", "CHF", "CAD", "AUD"]

    class BoutiqueUser(HttpUser):
        wait_time = between(1, 5)

        def on_start(self):
            currency = random.choice(CURRENCIES)
            self.client.get(f"/setCurrency?currency_code={currency}", name="/setCurrency")

        @task(5)
        def browse_home(self):
            self.client.get("/", name="/ [Home]")

        @task(4)
        def view_product(self):
            pid = random.choice(PRODUCT_IDS)
            self.client.get(f"/product/{pid}", name="/product/[id]")

        @task(2)
        def add_to_cart(self):
            pid = random.choice(PRODUCT_IDS)
            self.client.get(f"/product/{pid}", name="/product/[id]")
            self.client.post("/cart", data={"product_id": pid, "quantity": "1"}, name="/cart [POST add]")

        @task(2)
        def view_cart(self):
            self.client.get("/cart", name="/cart [GET]")

        @task(1)
        def full_checkout(self):
            pid = random.choice(PRODUCT_IDS)
            self.client.get("/", name="/ [Home]")
            self.client.get(f"/product/{pid}", name="/product/[id]")
            self.client.post("/cart", data={"product_id": pid, "quantity": str(random.randint(1,3))}, name="/cart [POST add]")
            self.client.get("/cart", name="/cart [GET]")
            self.client.post("/cart/checkout", data={
                "email": f"user{random.randint(1,999)}@example.com",
                "street_address": f"{random.randint(1,9999)} Main St",
                "zip_code": f"{random.randint(10000,99999)}",
                "city": "Mountain View", "state": "CA", "country": "US",
                "credit_card_number": "4432-8015-6152-0454",
                "credit_card_expiration_month": "1",
                "credit_card_expiration_year": "2030",
                "credit_card_cvv": "623",
            }, name="/cart/checkout [POST]")

        @task(1)
        def switch_currency(self):
            currency = random.choice(CURRENCIES)
            self.client.get(f"/setCurrency?currency_code={currency}", name="/setCurrency")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: boutique
  labels:
    app: locust-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
      annotations:
        # Disable Istio sidecar for Locust to reduce overhead.
        # Traffic still reaches frontend through Istio (inbound sidecar on frontend).
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: master
          image: locustio/locust:2.29
          ports:
            - containerPort: 8089
          env:
            - name: LOCUST_HOST
              value: "http://frontend:80"
            - name: LOCUST_MODE
              value: "standalone"
          volumeMounts:
            - name: locust-scripts
              mountPath: /home/locust/locustfile.py
              subPath: locustfile.py
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: locust-scripts
          configMap:
            name: locust-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: boutique
spec:
  type: NodePort
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30001
      protocol: TCP
  selector:
    app: locust-master
