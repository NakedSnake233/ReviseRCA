apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ts-travel-service-hpa
  namespace: trainticket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ts-travel-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
---
