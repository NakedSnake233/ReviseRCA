# ============================================================
# Locust load generator deployment for TrainTicket
# Namespace: trainticket
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts-trainticket
  namespace: trainticket
data:
  locustfile.py: |
    """
    Locust load generator for TrainTicket.
    """
    import random, json
    from locust import HttpUser, task, between

    STATIONS = [
        "Shang Hai", "Bei Jing", "Nan Jing", "Su Zhou", "Tai Yuan",
        "Shi Jia Zhuang", "Wu Han", "Xi An", "Zheng Zhou", "Ji Nan",
        "Hang Zhou", "Guang Zhou", "Chang Sha", "Tian Jin", "Cheng Du",
    ]
    USER_ID = "4d2a08c0-81a5-4c18-8698-f4a4d104c68a"
    USER_NAME = "fdse_microservice"
    PASSWORD = "111111"

    class TrainTicketUser(HttpUser):
        wait_time = between(1, 3)
        host = "http://ts-ui-dashboard:8080"

        def on_start(self):
            self.token = ""
            with self.client.post("/api/v1/users/login",
                    json={"userName": USER_NAME, "password": PASSWORD},
                    name="/login", catch_response=True) as resp:
                if resp.status_code == 200:
                    try:
                        self.token = resp.json().get("data", {}).get("token", "")
                    except: pass

        def _h(self):
            return {"Authorization": f"Bearer {self.token}"} if self.token else {}

        @task(10)
        def search_trains(self):
            dep, arr = random.sample(STATIONS, 2)
            self.client.post("/api/v1/travelservice/trips/left",
                json={"startingPlace": dep, "endPlace": arr, "departureTime": "2026-07-01"},
                headers=self._h(), name="/trips [search]", catch_response=True)

        @task(4)
        def search_high_speed(self):
            dep, arr = random.sample(STATIONS, 2)
            self.client.post("/api/v1/travel2service/trips/left",
                json={"startingPlace": dep, "endPlace": arr, "departureTime": "2026-07-01"},
                headers=self._h(), name="/trips [high-speed]", catch_response=True)

        @task(3)
        def view_orders(self):
            self.client.get(f"/api/v1/orderservice/order/{USER_ID}",
                headers=self._h(), name="/order [GET]", catch_response=True)

        @task(3)
        def view_other_orders(self):
            self.client.get(f"/api/v1/orderOtherService/orderOther/{USER_ID}",
                headers=self._h(), name="/orderOther [GET]", catch_response=True)

        @task(2)
        def view_route_plan(self):
            dep, arr = random.sample(STATIONS, 2)
            self.client.post("/api/v1/routeplanservice/routePlan/cheapestRoute",
                json={"fromStationName": dep, "toStationName": arr},
                headers=self._h(), name="/routePlan [cheapest]", catch_response=True)

        @task(1)
        def get_stations(self):
            self.client.get("/api/v1/stationservice/stations",
                headers=self._h(), name="/stations", catch_response=True)

        @task(1)
        def get_contacts(self):
            self.client.get(f"/api/v1/contactservice/contacts/account/{USER_ID}",
                headers=self._h(), name="/contacts", catch_response=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-trainticket
  namespace: trainticket
  labels:
    app: locust-trainticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-trainticket
  template:
    metadata:
      labels:
        app: locust-trainticket
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: master
          image: locustio/locust:2.32.6
          # Run a small, continuous workload so every fault window contains
          # request, log, and trace evidence.  The previous deployment only
          # started the web UI and therefore exported empty telemetry files.
          args:
            - -f
            - /home/locust/locustfile.py
            - --autostart
            - --users
            - "3"
            - --spawn-rate
            - "1"
          ports:
            - containerPort: 8089
          env:
            - name: LOCUST_HOST
              value: "http://ts-ui-dashboard:8080"
            - name: LOCUST_MODE
              value: "standalone"
          volumeMounts:
            - name: locust-scripts
              mountPath: /home/locust/locustfile.py
              subPath: locustfile.py
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: locust-scripts
          configMap:
            name: locust-scripts-trainticket
---
apiVersion: v1
kind: Service
metadata:
  name: locust-trainticket
  namespace: trainticket
spec:
  type: NodePort
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30083
      protocol: TCP
  selector:
    app: locust-trainticket
