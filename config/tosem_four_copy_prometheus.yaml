prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    additionalScrapeConfigs:
      - job_name: istio-proxy-copies
        metrics_path: /stats/prometheus
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: (boutique|trainticket)-c[1-4]
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: istio-proxy
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:15090
            action: replace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
            action: replace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
            action: replace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
            action: replace
grafana:
  enabled: false
alertmanager:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
